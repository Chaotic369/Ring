<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aesthetic Ringtone Cutter</title>
  <style>
    :root {
          --bg-color: #e0e5ec;
          --neu-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
          --neu-inset: inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
          --neu-shadow-sm: 4px 4px 8px rgb(163,177,198,0.5), -4px -4px 8px rgba(255,255,255, 0.5);
          --neu-inset-sm: inset 3px 3px 6px 0 rgba(163,177,198, 0.6), inset -3px -3px 6px 0 rgba(255,255,255, 0.7);
          --text-main: #000000;
          --text-muted: #000000;
          --accent: #8b5cf6;
          --accent-hover: #7c3aed;
          --accent-light: rgba(139, 92, 246, 0.15);
          --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    html, body {
          width: 100%;
          height: 100%;
        }

        body {
          background-color: var(--bg-color);
          color: var(--text-main);
          min-height: 100vh;
          min-height: 100dvh;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          justify-content: stretch;
          overflow: hidden;
          position: relative;
        }

    /* Main App Container */
        .app-container {
              width: 100%;
              height: 100%;
              max-width: none;
              background: var(--bg-color);
              border: none;
              border-radius: 0;
              box-shadow: none;
              padding: 24px 20px;
              padding-top: max(24px, env(safe-area-inset-top));
              padding-bottom: max(24px, env(safe-area-inset-bottom));
              display: flex;
              flex-direction: column;
              justify-content: center;
              gap: 24px;
              overflow-y: auto;
              transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            }

    /* Header */
    header {
      text-align: center;
    }
    h1 {
              font-size: 11px;
              font-weight: 500;
              letter-spacing: -0.1px;
              color: #000000;
              -webkit-text-fill-color: #000000;
              margin-bottom: 4px;
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
              max-width: 100%;
              padding: 0 10px;
            }

    /* Screens */
    .screen {
      display: none;
      flex-direction: column;
      gap: 24px;
      animation: fadeIn 0.4s ease forwards;
    }
    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Upload Screen */
        .upload-zone {
          border: none;
          border-radius: 24px;
          padding: 40px 20px;
          text-align: center;
          background: var(--bg-color);
          box-shadow: var(--neu-inset);
          cursor: pointer;
          transition: all 0.2s ease;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
        }
        .upload-zone:hover {
          box-shadow: inset 8px 8px 12px 0 rgba(163,177,198, 0.8), inset -8px -8px 12px 0 rgba(255,255,255, 0.9);
        }
        .upload-icon {
          width: 64px;
          height: 64px;
          background: var(--bg-color);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: var(--neu-shadow-sm);
          color: var(--accent);
          margin-bottom: 8px;
        }
    .upload-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }
    .upload-subtext {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Editor Screen */
        .media-preview-container {
              width: 100%;
              height: 180px;
              border-radius: 16px;
              overflow: hidden;
              position: relative;
              background: var(--bg-color);
              box-shadow: var(--neu-inset);
              border: none;
              display: flex;
              flex-direction: column;
            }

            /* Zoomable, scrollable timeline viewport */
            .timeline-scroll {
              position: relative;
              flex: 1;
              overflow-x: auto;
              overflow-y: hidden;
              touch-action: pan-x;
              scrollbar-width: thin;
              -webkit-overflow-scrolling: touch;
            }
            .timeline-inner {
              position: relative;
              height: 100%;
              width: 100%;
            }
            .time-ruler {
              position: absolute;
              top: 0;
              left: 0;
              right: 0;
              height: 18px;
              pointer-events: none;
            }
            .ruler-tick {
                      position: absolute;
                      top: 0;
                      height: 8px;
                      border-left: 0.5px solid #f97316;
                    }
            .ruler-label {
              position: absolute;
              top: 6px;
              font-size: 9px;
              font-weight: 600;
              color: var(--text-muted);
              transform: translateX(3px);
              font-variant-numeric: tabular-nums;
              white-space: nowrap;
            }
            .playhead {
                      position: absolute;
                      top: 0;
                      bottom: 0;
                      width: 1px;
                      background: #f97316;
                      box-shadow: 0 0 4px rgba(249, 115, 22, 0.6);
                      pointer-events: auto;
                      cursor: ew-resize;
                      touch-action: none;
                      z-index: 10;
                      left: 0;
                    }
                    .playhead::before {
                      content: '';
                      position: absolute;
                      top: 0;
                      left: -10px;
                      width: 20px;
                      height: 100%;
                      background: transparent;
                    }
                    .playhead::after {
                      content: '';
                      position: absolute;
                      top: 0;
                      left: -5px;
                      width: 11px;
                      height: 11px;
                      background: #f97316;
                      border-radius: 50%;
                      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
                    }
            .zoom-controls {
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 14px;
              padding: 8px 0;
              background: transparent;
            }
            .zoom-btn {
              width: 34px;
              height: 34px;
              border-radius: 50%;
              background: var(--bg-color);
              border: none;
              color: var(--text-main);
              font-size: 16px;
              font-weight: 700;
              line-height: 1;
              cursor: pointer;
              box-shadow: var(--neu-shadow-sm);
              transition: all 0.2s ease;
            }
            .zoom-btn:active {
              box-shadow: var(--neu-inset-sm);
            }
        .zoom-label {
          font-size: 11px;
          font-weight: 600;
          color: var(--text-muted);
          min-width: 44px;
          text-align: center;
          font-variant-numeric: tabular-nums;
        }
    /* Hidden media elements used for processing */
    #sourceMedia {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.15;
      z-index: 0;
      pointer-events: none;
    }
    
    /* Custom Waveform & Trimmer */
    .trimmer-wrapper {
          position: absolute;
          top: 18px;
          bottom: 0;
          left: 0;
          right: 0;
          z-index: 1;
        }
    canvas#waveform {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 8px;
    }
    .selection-overlay {
          position: absolute;
          top: 0;
          bottom: 0;
          background: var(--accent-light);
          border-left: 1px solid #f97316;
          border-right: 1px solid #f97316;
          pointer-events: none;
        }

    /* Dual Range Sliders styling */
    .range-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: transparent;
      pointer-events: none;
      outline: none;
      margin: 0;
    }
    input[type=range]::-webkit-slider-thumb {
          -webkit-appearance: none;
          pointer-events: auto;
          width: 8px;
                height: 160px; /* Tall handle for easy grabbing */
                background: #000000;
                border: 1px solid #000000;
                border-radius: 4px;
                cursor: ew-resize;
                box-shadow: 2px 2px 6px rgba(163,177,198,0.6), -2px -2px 6px rgba(255,255,255,0.6);
                margin-top: 0;
              }
        input[type=range]::-moz-range-thumb {
          pointer-events: auto;
          width: 8px;
                height: 160px;
                background: #000000;
                border: 1px solid #000000;
                border-radius: 4px;
                cursor: ew-resize;
                box-shadow: 2px 2px 6px rgba(163,177,198,0.6), -2px -2px 6px rgba(255,255,255,0.6);
              }

              /* Time Info */
        .time-info {
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 12px;
          font-weight: 600;
          color: var(--text-muted);
          font-variant-numeric: tabular-nums;
        }
        .duration-badge {
              background: var(--bg-color);
              padding: 6px 14px;
              border-radius: 999px;
              color: #000000;
              box-shadow: var(--neu-shadow-sm);
            }

    /* Playback Controls */
        .controls {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 24px;
        }
        .btn-icon {
          width: 50px;
          height: 50px;
          border-radius: 50%;
          background: var(--bg-color);
          border: none;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          color: var(--text-main);
          box-shadow: var(--neu-shadow);
          transition: all 0.2s ease;
        }
        .btn-icon:active {
          box-shadow: var(--neu-inset-sm);
          transform: scale(0.95);
        }
        .btn-icon.play-btn {
          width: 64px;
          height: 64px;
          color: var(--accent);
        }
        .btn-icon.play-btn:active {
          box-shadow: var(--neu-inset);
        }

        /* Export Button */
            .btn-primary {
              width: 100%;
              padding: 16px;
              border-radius: 16px;
              background: var(--bg-color);
              border: none;
              color: #000000;
              font-size: 14px;
              font-weight: 700;
              cursor: pointer;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
              transition: all 0.2s ease;
              box-shadow: var(--neu-shadow);
            }
        .btn-primary:active {
          box-shadow: var(--neu-inset);
          transform: translateY(2px);
        }

    /* Reset Button */
    .btn-text {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: transparent;
      transition: text-decoration-color 0.2s ease;
      margin-top: -8px;
    }
    .btn-text:hover {
      color: var(--text-main);
      text-decoration-color: var(--text-main);
    }

    svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  

  <main class="app-container">
    <header>
          <h1 id="trackTitle">Select Media</h1>
        </header>

    <!-- SCREEN 1: UPLOAD -->
    <section id="uploadScreen" class="screen active">
      <input type="file" id="fileInput" accept="video/*, audio/*" style="display: none;">
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">
          <svg width="24" height="24" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        </div>
        <div class="upload-text">Tap to select Media</div>
        <div class="upload-subtext">Supports MP4, MOV, MP3, WAV, M4A</div>
      </div>
    </section>

    <!-- SCREEN 2: EDITOR -->
    <section id="editorScreen" class="screen">
      
      <div class="media-preview-container">
              <!-- We use a video element so it natively handles both audio and video files -->
              <video id="sourceMedia" playsinline></video>
        
              <div class="timeline-scroll" id="timelineScroll">
                <div class="timeline-inner" id="timelineInner">
                  <div class="time-ruler" id="timeRuler"></div>
                  <div class="trimmer-wrapper">
                    <canvas id="waveform"></canvas>
                    <div id="selectionOverlay" class="selection-overlay"></div>
              
                    <div class="range-track">
                      <input type="range" id="sliderStart" min="0" max="100" value="0" step="0.1">
                      <input type="range" id="sliderEnd" min="0" max="100" value="30" step="0.1">
                    </div>
                  </div>
                  <div class="playhead" id="playhead"></div>
                </div>
              </div>

              <div class="zoom-controls">
                <button class="zoom-btn" id="btnZoomOut" title="Zoom out">−</button>
                <span class="zoom-label" id="zoomLabel">1x</span>
                <button class="zoom-btn" id="btnZoomIn" title="Zoom in">+</button>
              </div>
            </div>

      <div class="time-info">
        <span id="timeStart">00:00</span>
        <span class="duration-badge" id="timeDuration">30.0s Ringtone</span>
        <span id="timeEnd">00:30</span>
      </div>

      <div class="controls">
        <button class="btn-icon" id="btnRewind" title="Back to Start">
          <svg width="20" height="20" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
        </button>
        <button class="btn-icon play-btn" id="btnPlayPause">
          <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon></svg>
          <svg id="pauseIcon" width="24" height="24" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="4" width="4" height="16" fill="currentColor"></rect><rect x="14" y="4" width="4" height="16" fill="currentColor"></rect></svg>
        </button>
      </div>

      <button class="btn-primary" id="btnExport">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Save & Export Ringtone
      </button>

      <button class="btn-text" onclick="resetApp()">Start Over</button>

    </section>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadScreen = document.getElementById('uploadScreen');
    const editorScreen = document.getElementById('editorScreen');
    const media = document.getElementById('sourceMedia');
    
    const sliderStart = document.getElementById('sliderStart');
    const sliderEnd = document.getElementById('sliderEnd');
    const selectionOverlay = document.getElementById('selectionOverlay');
    
    const timeStartEl = document.getElementById('timeStart');
    const timeEndEl = document.getElementById('timeEnd');
    const timeDurationEl = document.getElementById('timeDuration');
    
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnRewind = document.getElementById('btnRewind');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const btnExport = document.getElementById('btnExport');

    let duration = 0;
        let isPlaying = false;
        let animationFrame;

        const timelineScroll = document.getElementById('timelineScroll');
        const timelineInner = document.getElementById('timelineInner');
        const timeRuler = document.getElementById('timeRuler');
        const playhead = document.getElementById('playhead');
        const zoomLabel = document.getElementById('zoomLabel');
        const btnZoomIn = document.getElementById('btnZoomIn');
        const btnZoomOut = document.getElementById('btnZoomOut');

        let zoomLevel = 1;
        const MIN_ZOOM = 1;
        const MAX_ZOOM = 40;
        let waveformPeaks = null; // Real decoded audio peaks (null until decoded)

    // File Upload Handler
        fileInput.addEventListener('change', function(e) {
          const file = e.target.files[0];
          if (!file) return;

          document.getElementById('trackTitle').innerText = file.name;

          const objectUrl = URL.createObjectURL(file);
      media.src = objectUrl;

      // Show video if it is a video file, otherwise just play audio in background
      if (file.type.startsWith('video/')) {
        media.style.opacity = '0.3';
      } else {
        media.style.opacity = '0';
      }

      media.onloadedmetadata = () => {
              duration = media.duration;
        
              // Setup Sliders
              sliderStart.max = duration;
              sliderEnd.max = duration;
        
              // Default selection: up to 30 seconds
              sliderStart.value = 0;
              sliderEnd.value = Math.min(30, duration);
        
              uploadScreen.classList.remove('active');
              editorScreen.classList.add('active');

              zoomLevel = 1;
              waveformPeaks = null;
              applyZoom();
              updateUI();
              drawProceduralWaveform();
              decodeRealWaveform(file);
              updatePlayhead();

              // Request full screen on first file pick (needs a user gesture; ignored if unsupported)
              try {
                const root = document.documentElement;
                if (!document.fullscreenElement && root.requestFullscreen) {
                  root.requestFullscreen().catch(() => {});
                }
              } catch (err) {}
            };
          });

    // Slider Logic (Prevent cross-over)
    const minGap = 1.0; // minimum 1 second ringtone

    function updateUI() {
          let startVal = parseFloat(sliderStart.value);
          let endVal = parseFloat(sliderEnd.value);

          if (endVal - startVal <= minGap) {
            if (this === sliderStart) {
          sliderStart.value = endVal - minGap;
          startVal = parseFloat(sliderStart.value);
        } else {
          sliderEnd.value = startVal + minGap;
          endVal = parseFloat(sliderEnd.value);
        }
      }

      // Update overlay visual
      const startPercent = (startVal / duration) * 100;
      const endPercent = (endVal / duration) * 100;
      selectionOverlay.style.left = startPercent + '%';
      selectionOverlay.style.width = (endPercent - startPercent) + '%';

      // Update Texts
      timeStartEl.innerText = formatTime(startVal);
      timeEndEl.innerText = formatTime(endVal);
      timeDurationEl.innerText = (endVal - startVal).toFixed(1) + 's Ringtone';

      // Enforce playback bounds if currently playing
      if (isPlaying && (media.currentTime < startVal || media.currentTime > endVal)) {
        media.currentTime = startVal;
      }
    }

    sliderStart.addEventListener('input', updateUI);
    sliderEnd.addEventListener('input', updateUI);

    // Playback Logic
    function togglePlay() {
      if (isPlaying) {
        media.pause();
        isPlaying = false;
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        cancelAnimationFrame(animationFrame);
      } else {
        const startVal = parseFloat(sliderStart.value);
        const endVal = parseFloat(sliderEnd.value);
        
        if (media.currentTime < startVal || media.currentTime >= endVal) {
          media.currentTime = startVal;
        }
        
        media.play();
        isPlaying = true;
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        trackPlayback();
      }
    }

    function trackPlayback() {
          if (!isPlaying) return;
      
          const endVal = parseFloat(sliderEnd.value);
          const startVal = parseFloat(sliderStart.value);
      
          // Loop back to start when reaching the end of selection
          if (media.currentTime >= endVal) {
            media.currentTime = startVal;
          }

          updatePlayhead();
          followPlayhead();
      
          animationFrame = requestAnimationFrame(trackPlayback);
        }

        // Moves the red playback line to the current time
                function updatePlayhead() {
                  if (!duration || isDraggingPlayhead) return;
                  const pct = (media.currentTime / duration) * 100;
                  playhead.style.left = pct + '%';
                }

                // Playhead Drag / Scrubbing Logic
                let isDraggingPlayhead = false;
                let wasPlayingBeforeDrag = false;

                function setPlayheadFromPointer(clientX) {
                  if (!duration) return;
                  const rect = timelineInner.getBoundingClientRect();
                  const offsetX = clientX - rect.left;
                  const clampedX = Math.max(0, Math.min(rect.width, offsetX));
                  const newTime = (clampedX / rect.width) * duration;
          
                  media.currentTime = newTime;
                  playhead.style.left = ((clampedX / rect.width) * 100) + '%';
                }

                playhead.addEventListener('pointerdown', (e) => {
                  if (!duration) return;
                  e.preventDefault();
                  e.stopPropagation();
                  isDraggingPlayhead = true;
                  wasPlayingBeforeDrag = isPlaying;
                  if (isPlaying) {
                    media.pause();
                    isPlaying = false;
                    playIcon.style.display = 'block';
                    pauseIcon.style.display = 'none';
                    cancelAnimationFrame(animationFrame);
                  }
                  playhead.setPointerCapture(e.pointerId);
                });

                playhead.addEventListener('pointermove', (e) => {
                  if (!isDraggingPlayhead) return;
                  setPlayheadFromPointer(e.clientX);
                });

                const stopPlayheadDrag = (e) => {
                  if (!isDraggingPlayhead) return;
                  isDraggingPlayhead = false;
                  try {
                    playhead.releasePointerCapture(e.pointerId);
                  } catch (err) {}
                  if (wasPlayingBeforeDrag) {
                    togglePlay();
                  }
                };

                playhead.addEventListener('pointerup', stopPlayheadDrag);
                playhead.addEventListener('pointercancel', stopPlayheadDrag);

        // Keeps the playhead visible by auto-scrolling the timeline while playing
        function followPlayhead() {
          const inner = timelineInner.offsetWidth;
          const view = timelineScroll.clientWidth;
          if (inner <= view) return;
          const x = (media.currentTime / duration) * inner;
          const left = timelineScroll.scrollLeft;
          if (x < left + 20 || x > left + view - 40) {
            timelineScroll.scrollLeft = Math.max(0, x - view * 0.3);
          }
        }

        // Zoom: widens the inner timeline; the scroll container makes it scrollable
        function applyZoom(anchorTime) {
          const view = timelineScroll.clientWidth;
          const prevInner = timelineInner.offsetWidth || view;
          const anchorPct = (typeof anchorTime === 'number' && duration) ? anchorTime / duration : null;
          const anchorScreenX = anchorPct !== null ? (anchorPct * prevInner - timelineScroll.scrollLeft) : 0;

          timelineInner.style.width = (100 * zoomLevel) + '%';
          zoomLabel.textContent = (Math.round(zoomLevel * 10) / 10) + 'x';

          if (anchorPct !== null) {
            timelineScroll.scrollLeft = Math.max(0, anchorPct * timelineInner.offsetWidth - anchorScreenX);
          }

          drawRuler();
          if (duration) drawProceduralWaveform();
          updatePlayhead();
        }

        function setZoom(newZoom, anchorTime) {
          zoomLevel = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
          applyZoom(anchorTime);
        }

        btnZoomIn.addEventListener('click', () => setZoom(zoomLevel * 1.6, media.currentTime));
        btnZoomOut.addEventListener('click', () => setZoom(zoomLevel / 1.6, media.currentTime));

        // Pinch-to-zoom on touch screens
        let pinchStartDist = 0;
        let pinchStartZoom = 1;
        timelineScroll.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            pinchStartDist = Math.sqrt(dx * dx + dy * dy);
            pinchStartZoom = zoomLevel;
          }
        }, { passive: true });
        timelineScroll.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2 && pinchStartDist > 0) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const rect = timelineScroll.getBoundingClientRect();
            const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
            const anchorTime = ((timelineScroll.scrollLeft + midX) / timelineInner.offsetWidth) * duration;
            setZoom(pinchStartZoom * (dist / pinchStartDist), anchorTime);
            e.preventDefault();
          }
        }, { passive: false });
        timelineScroll.addEventListener('touchend', () => { pinchStartDist = 0; }, { passive: true });

        // Ctrl/Cmd + wheel zoom on desktop
        timelineScroll.addEventListener('wheel', (e) => {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            const rect = timelineScroll.getBoundingClientRect();
            const anchorTime = ((timelineScroll.scrollLeft + (e.clientX - rect.left)) / timelineInner.offsetWidth) * duration;
            setZoom(zoomLevel * (e.deltaY < 0 ? 1.15 : 1 / 1.15), anchorTime);
          }
        }, { passive: false });

        // Draws time ticks and labels that adapt to the zoom level
        function drawRuler() {
          timeRuler.innerHTML = '';
          if (!duration) return;
          const steps = [0.1, 0.25, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300];
          const pxPerSec = timelineInner.offsetWidth / duration;
          let step = steps[steps.length - 1];
          for (const s of steps) {
            if (s * pxPerSec >= 60) { step = s; break; }
          }
          for (let t = 0; t <= duration; t += step) {
            const tick = document.createElement('div');
            tick.className = 'ruler-tick';
            tick.style.left = ((t / duration) * 100) + '%';
            timeRuler.appendChild(tick);
            const label = document.createElement('div');
            label.className = 'ruler-label';
            label.style.left = ((t / duration) * 100) + '%';
            label.textContent = step < 1 ? t.toFixed(1) + 's' : formatTime(t);
            timeRuler.appendChild(label);
          }
        }

        // Decodes the real audio so the graph shows the true waveform (falls back to procedural on failure)
            function decodeRealWaveform(file) {
              try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const reader = new FileReader();
                reader.onload = () => {
                  const audioCtx = new AudioCtx();
                  audioCtx.decodeAudioData(reader.result).then((buffer) => {
                    const data = buffer.getChannelData(0);
                    const bucketCount = 12000;
                    const block = Math.max(1, Math.floor(data.length / bucketCount));
                    const peaks = new Float32Array(bucketCount);
                    for (let i = 0; i < bucketCount; i++) {
                      let max = 0;
                      const startIdx = i * block;
                      const endIdx = Math.min(data.length, startIdx + block);
                      for (let j = startIdx; j < endIdx; j += 4) {
                        const v = Math.abs(data[j]);
                        if (v > max) max = v;
                      }
                      peaks[i] = max;
                    }
                    waveformPeaks = peaks;
                    drawProceduralWaveform();
                    audioCtx.close().catch(() => {});
                  }).catch(() => {
                    audioCtx.close().catch(() => {});
                  });
                };
                reader.onerror = () => {};
                reader.readAsArrayBuffer(file);
              } catch (err) {}
            }

        // Keep the playhead in sync when scrubbing or while paused
        media.addEventListener('timeupdate', updatePlayhead);
        media.addEventListener('seeked', updatePlayhead);
        window.addEventListener('resize', () => { if (duration) applyZoom(); });

    btnPlayPause.addEventListener('click', togglePlay);
    btnRewind.addEventListener('click', () => {
      media.currentTime = parseFloat(sliderStart.value);
      if(!isPlaying) togglePlay();
    });

    // Formatting Utils
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // Procedural Aesthetic Waveform (Since extracting actual audio data requires WebAudio API decoding which takes time)
        function drawProceduralWaveform() {
              const canvas = document.getElementById('waveform');
              const ctx = canvas.getContext('2d');
              canvas.width = Math.min(canvas.offsetWidth * 2, 16000); // High DPI, capped for memory safety
              canvas.height = canvas.offsetHeight * 2;
      
              const width = canvas.width;
              const height = canvas.height;
              const midY = height / 2;
      
              ctx.clearRect(0, 0, width, height);

              // Subtle horizontal grid reference lines
              ctx.lineWidth = 1;
              ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
              [0.2, 0.35, 0.5, 0.65, 0.8].forEach(ratio => {
                const gy = height * ratio;
                ctx.beginPath();
                ctx.moveTo(0, gy);
                ctx.lineTo(width, gy);
                ctx.stroke();
              });
      
              const barWidth = 1.5;
              const barGap = 1.5;
              const bars = Math.floor(width / (barWidth + barGap));
      
              for (let i = 0; i < bars; i++) {
                let primaryPeak = 0;
                let secondaryPeak = 0;

                if (waveformPeaks) {
                  const from = Math.floor((i / bars) * waveformPeaks.length);
                  const to = Math.max(from + 1, Math.floor(((i + 1) / bars) * waveformPeaks.length));
                  let sum = 0;
                  for (let k = from; k < to && k < waveformPeaks.length; k++) {
                    const val = waveformPeaks[k];
                    if (val > primaryPeak) primaryPeak = val;
                    sum += val;
                  }
                  secondaryPeak = sum / (to - from);
                } else {
                  const harmonic1 = Math.sin(i * 0.08) * 0.35;
                  const harmonic2 = Math.sin(i * 0.33) * 0.25;
                  const harmonic3 = Math.cos(i * 0.85) * 0.15;
                  const microJitter = (Math.sin(i * 3.14) * 0.5 + 0.5) * 0.15;
                  primaryPeak = Math.abs(harmonic1 + harmonic2 + harmonic3) + microJitter + 0.06;
                  secondaryPeak = primaryPeak * 0.55;
                }

                const totalH = Math.max(3, Math.min(1, primaryPeak * 1.6) * height * 0.86);
                const coreH = Math.max(2, Math.min(1, secondaryPeak * 1.6) * height * 0.86);
                const x = i * (barWidth + barGap);

                // Layer 1: Outer detailed frequency envelope
                ctx.fillStyle = waveformPeaks ? 'rgba(30, 41, 59, 0.35)' : 'rgba(30, 41, 59, 0.2)';
                ctx.fillRect(x, midY - totalH / 2, barWidth, totalH);

                // Layer 2: Core density spike
                ctx.fillStyle = waveformPeaks ? 'rgba(15, 23, 42, 0.85)' : 'rgba(15, 23, 42, 0.6)';
                ctx.fillRect(x, midY - coreH / 2, barWidth, coreH);
              }

              // Center baseline reference
                            ctx.strokeStyle = 'rgba(0, 0, 0, 0.12)';
                            ctx.beginPath();
                            ctx.moveTo(0, midY);
                            ctx.lineTo(width, midY);
                            ctx.stroke();
                          }

    // Export Mockup
    btnExport.addEventListener('click', () => {
      const btnOrigText = btnExport.innerHTML;
      btnExport.innerHTML = `<svg class="spinner" width="18" height="18" viewBox="0 0 24 24" style="animation: spin 1s linear infinite;"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg> Processing...`;
      
      // Simulate export delay
      setTimeout(() => {
        btnExport.innerHTML = btnOrigText;
        alert(`Success! Ringtone cut from ${timeStartEl.innerText} to ${timeEndEl.innerText}.\n\n(In the Native Android version, this will trigger FFmpeg to slice the file and open the system Ringtone Setter.)`);
      }, 1500);
    });

    // Reset App
        function resetApp() {
          media.pause();
                media.removeAttribute('src');
                fileInput.value = '';
                document.getElementById('trackTitle').innerText = 'Select Media';
            waveformPeaks = null;
            zoomLevel = 1;
            duration = 0;
            isPlaying = false;
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      cancelAnimationFrame(animationFrame);
      
      editorScreen.classList.remove('active');
      uploadScreen.classList.add('active');
    }

    // Setup CSS for spinner
    const style = document.createElement('style');
    style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
    document.head.appendChild(style);
  </script>
</body>
