<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Forces a fixed 400px logical width to override developer option DPI scaling -->
  <meta name="viewport" content="width=400, user-scalable=no, viewport-fit=cover">
  <title>Aesthetic Ringtone Cutter</title>
  <style>
    :root {
              --bg-color: #e0e5ec;
              --neu-shadow: none;
              --neu-inset: none;
              --neu-shadow-sm: none;
              --neu-inset-sm: none;
              --text-main: #000000;
              --text-muted: #000000;
              --accent: #8b5cf6;
              --accent-hover: #7c3aed;
              --accent-light: rgba(139, 92, 246, 0.15);
              --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }

        :root.dark-mode {
                      --bg-color: #3E1212;
                      --neu-shadow: none;
                      --neu-inset: none;
                      --neu-shadow-sm: none;
                      --neu-inset-sm: none;
                      --text-main: #f5e6e6;
                      --text-muted: #d9b8b8;
                    }
    
                  :root.dark-mode .upload-zone:hover {
                    box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.8) !important;
                  }
    
              :root.dark-mode h1,
                  :root.dark-mode .duration-badge,
                  :root.dark-mode .btn-primary,
                  :root.dark-mode .modal-box h3,
                  :root.dark-mode .btn-cancel {
                    color: var(--text-main) !important;
                    -webkit-text-fill-color: var(--text-main) !important;
                  }
    
              :root.dark-mode .range-track input[type=range]::-webkit-slider-thumb,
                  :root.dark-mode .range-track input[type=range]::-moz-range-thumb {
                    background: var(--text-main) !important;
                    border-color: var(--text-main) !important;
                    box-shadow: none !important;
                  }
    
              :root.dark-mode .ruler-tick,
              :root.dark-mode .ruler-subtick {
                border-color: var(--text-main) !important;
              }
    
              :root.dark-mode .modal-box p {
                color: rgba(255, 255, 255, 0.7);
              }
    
              :root.dark-mode .gain-slider {
                accent-color: var(--text-main) !important;
              }

              * {
                    box-sizing: border-box;
                    margin: 0;
                    padding: 0;
                    font-family: var(--font);
                    -webkit-font-smoothing: antialiased;
                    -webkit-tap-highlight-color: transparent;
                  }

    html, body {
          width: 100%;
          height: 100%;
        }

        body {
                  background-color: #000000;
                  color: var(--text-main);
                  min-height: 100vh;
                  min-height: 100dvh;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  overflow: hidden;
                  position: relative;
                  padding: 20px;
                }

            /* Main App Container */
                    .app-container {
                          width: 100%;
                          height: auto;
                          max-height: 100%;
                          max-width: 420px;
                          background: var(--bg-color);
                          border: none;
                          border-radius: 32px;
                          box-shadow: var(--neu-shadow);
                          padding: 32px 24px;
                          display: flex;
                          flex-direction: column;
                          justify-content: center;
                          gap: 24px;
                          overflow-y: auto;
                          transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                        }

                /* Glassmorphism for Wallpaper Mode */
                .app-container.glass-active {
                  background: rgba(255, 255, 255, 0.25);
                  backdrop-filter: blur(24px);
                  -webkit-backdrop-filter: blur(24px);
                  border: 1px solid rgba(255, 255, 255, 0.3);
                  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
                }
                :root.dark-mode .app-container.glass-active {
                      background: rgba(0, 0, 0, 0.55);
                      border: 1px solid rgba(255, 255, 255, 0.05);
                      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
                    }
                    body.has-wallpaper {
                      background-size: cover;
                      background-position: center;
                      background-repeat: no-repeat;
                      transition: box-shadow 0.3s ease;
                    }
                    :root.dark-mode body.has-wallpaper {
                      box-shadow: inset 0 0 0 9999px rgba(0, 0, 0, 0.65);
                    }

                /* Header */
    header {
      text-align: center;
    }
    h1 {
              font-size: 11px;
              font-weight: 500;
              letter-spacing: -0.1px;
              color: #000000;
              -webkit-text-fill-color: #000000;
              margin-bottom: 4px;
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
              max-width: 100%;
              padding: 0 10px;
            }

    /* Screens */
    .screen {
      display: none;
      flex-direction: column;
      gap: 24px;
      animation: fadeIn 0.4s ease forwards;
    }
    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Upload Screen */
        .upload-zone {
          border: none;
          border-radius: 24px;
          padding: 40px 20px;
          text-align: center;
          background: var(--bg-color);
          box-shadow: var(--neu-inset);
          cursor: pointer;
          transition: all 0.2s ease;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
        }
        .upload-zone:hover {
          box-shadow: inset 8px 8px 12px 0 rgba(163,177,198, 0.8), inset -8px -8px 12px 0 rgba(255,255,255, 0.9);
        }
        .upload-icon {
                  width: 64px;
                  height: 64px;
                  background: transparent;
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  box-shadow: none;
                  color: var(--accent);
                  margin-bottom: 8px;
                }
    .upload-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }
    .upload-subtext {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Editor Screen */
        .media-preview-container {
              width: 100%;
              height: 180px;
              border-radius: 16px;
              overflow: hidden;
              position: relative;
              background: var(--bg-color);
              box-shadow: inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
              border: none;
              display: flex;
              flex-direction: column;
            }
        
        :root.dark-mode .media-preview-container {
              box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.6);
            }

            /* Zoomable, scrollable timeline viewport */
            .timeline-scroll {
              position: relative;
              flex: 1;
              overflow-x: auto;
              overflow-y: hidden;
              touch-action: pan-x;
              scrollbar-width: thin;
              -webkit-overflow-scrolling: touch;
            }
            .timeline-inner {
              position: relative;
              height: 100%;
              width: 100%;
            }
            .time-ruler {
              position: absolute;
              top: 0;
              left: 0;
              right: 0;
              height: 18px;
              pointer-events: none;
            }
            .ruler-tick {
                                  position: absolute;
                                  top: 0;
                                  height: 8px;
                                  border-left: 0.5px solid #000000;
                                }
                        .ruler-subtick {
                                  position: absolute;
                                  top: 0;
                                  height: 4px;
                                  border-left: 0.5px solid rgba(0, 0, 0, 0.4);
                                }
                        .ruler-label {
                          position: absolute;
                          top: 8px;
                          font-size: 9px;
                          font-weight: 600;
                          color: var(--text-muted);
                          transform: translateX(3px);
                          font-variant-numeric: tabular-nums;
                          white-space: nowrap;
                        }
            .playhead {
                                  position: absolute;
                                  top: 0;
                                  bottom: 0;
                                  width: 1px;
                                  background: #f97316;
                                  box-shadow: none;
                                  pointer-events: auto;
                                  cursor: ew-resize;
                                  touch-action: none;
                                  z-index: 10;
                                  left: 0;
                                }
                                .playhead::before {
                                  content: '';
                                  position: absolute;
                                  top: 0;
                                  left: -10px;
                                  width: 20px;
                                  height: 100%;
                                  background: transparent;
                                }
                                .playhead::after {
                                  content: '';
                                  position: absolute;
                                  top: 0;
                                  left: -5px;
                                  width: 11px;
                                  height: 11px;
                                  background: #f97316;
                                  border-radius: 50%;
                                  box-shadow: none;
                                }
            .zoom-controls {
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 14px;
              padding: 8px 0;
              background: transparent;
            }
            .zoom-btn {
                      width: 34px;
                      height: 34px;
                      border-radius: 50%;
                      background: transparent;
                      border: none;
                      color: var(--text-main);
                      font-size: 16px;
                      font-weight: 700;
                      line-height: 1;
                      cursor: pointer;
                      box-shadow: none;
                      transition: all 0.2s ease;
                    }
                    .zoom-btn:active {
                      transform: scale(0.9);
                    }
        .zoom-label {
          font-size: 11px;
          font-weight: 600;
          color: var(--text-muted);
          min-width: 44px;
          text-align: center;
          font-variant-numeric: tabular-nums;
        }
    /* Hidden media elements used for processing */
        #sourceMedia {
          position: absolute;
          width: 100%;
          height: 100%;
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
          z-index: 0;
        }
    
    /* Custom Waveform & Trimmer */
    .trimmer-wrapper {
          position: absolute;
          top: 18px;
          bottom: 0;
          left: 0;
          right: 0;
          z-index: 1;
        }
    canvas#waveform {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 8px;
    }
    .selection-overlay {
          position: absolute;
          top: 0;
          bottom: 0;
          background: var(--accent-light);
          border-left: 1px solid #f97316;
          border-right: 1px solid #f97316;
          pointer-events: none;
        }

    /* Dual Range Sliders styling */
        .range-track {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
        }
        .range-track input[type=range] {
          -webkit-appearance: none;
          appearance: none;
          width: 100%;
          height: 100%;
          position: absolute;
          top: 0;
          left: 0;
          background: transparent;
          pointer-events: none;
          outline: none;
          margin: 0;
        }
        .range-track input[type=range]::-webkit-slider-thumb {
                  -webkit-appearance: none;
                  pointer-events: auto;
                  width: 8px;
                        height: 160px; /* Tall handle for easy grabbing */
                        background: #000000;
                        border: 1px solid #000000;
                        border-radius: 4px;
                        cursor: ew-resize;
                        box-shadow: none;
                        margin-top: 0;
                      }
                .range-track input[type=range]::-moz-range-thumb {
                  pointer-events: auto;
                  width: 8px;
                        height: 160px;
                        background: #000000;
                        border: 1px solid #000000;
                        border-radius: 4px;
                        cursor: ew-resize;
                        box-shadow: none;
                      }

              /* Time Info & Nudge Controls */
                      .time-info {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        font-size: 12px;
                        font-weight: 600;
                        color: var(--text-muted);
                        font-variant-numeric: tabular-nums;
                        gap: 6px;
                      }
                      
                                                                  .duration-badge {
                                                                                              background: transparent;
                                                                                              padding: 6px 14px;
                                                                                              border-radius: 999px;
                                                                                              color: #000000;
                                                                                              box-shadow: none;
                                                                                            }
                                                                  .btn-toggle.active {
                                                                    box-shadow: none !important;
                                                                    color: var(--accent);
                                                                    transform: scale(0.9);
                                                                  }
                      .gain-panel {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 10px;
                        font-size: 11px;
                        font-weight: 600;
                      }
                      .gain-slider {
                        position: relative !important;
                        width: 120px !important;
                        height: 6px !important;
                        pointer-events: auto !important;
                        accent-color: #000;
                      }

                  /* Playback Controls */
        .controls {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 24px;
        }
        .btn-icon {
                  width: 50px;
                  height: 50px;
                  border-radius: 50%;
                  background: transparent;
                  border: none;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  cursor: pointer;
                  color: var(--text-main);
                  box-shadow: none;
                  transition: all 0.2s ease;
                }
                .btn-icon:active {
                  transform: scale(0.9);
                }
                .btn-icon:active {
                  transform: scale(0.9);
                }
        .btn-icon.play-btn {
          width: 64px;
          height: 64px;
          color: var(--accent);
        }
        .btn-icon.play-btn:active {
          box-shadow: var(--neu-inset);
        }

        /* Export Button */
                    .btn-primary {
                      width: 100%;
                      padding: 16px;
                      border-radius: 16px;
                      background: transparent;
                      border: none;
                      color: #000000;
                      font-size: 14px;
                      font-weight: 700;
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      gap: 8px;
                      transition: all 0.2s ease;
                      box-shadow: none;
                    }
                .btn-primary:active {
                  transform: scale(0.96);
                }
                .btn-primary:active {
                  transform: scale(0.96);
                }

    /* Reset Button */
        .btn-text {
          background: none;
          border: none;
          color: #991b1b;
          font-size: 12px;
          font-weight: 600;
          cursor: pointer;
          text-decoration: underline;
          text-decoration-color: transparent;
          transition: text-decoration-color 0.2s ease;
          margin-top: -8px;
        }
        .btn-text:hover {
          color: #7f1d1d;
          text-decoration-color: #7f1d1d;
        }

    svg {
          fill: none;
          stroke: currentColor;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        /* Modal Styling */
        .modal-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.5);
          backdrop-filter: blur(3px);
          -webkit-backdrop-filter: blur(3px);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 1000;
          opacity: 0;
          visibility: hidden;
          transition: opacity 0.2s ease, visibility 0.2s ease;
        }
        .modal-overlay.active {
          opacity: 1;
          visibility: visible;
        }
        .modal-box {
          background: var(--bg-color);
          padding: 24px;
          border-radius: 16px;
          box-shadow: var(--neu-shadow);
          text-align: center;
          max-width: 280px;
          width: 90%;
          transform: translateY(20px);
          transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-box {
          transform: translateY(0);
        }
        .modal-box h3 {
          font-size: 16px;
          margin-bottom: 8px;
          color: #000000;
        }
        .modal-box p {
          font-size: 13px;
          color: rgba(0, 0, 0, 0.6);
          margin-bottom: 24px;
        }
        .modal-actions {
          display: flex;
          gap: 12px;
          justify-content: center;
        }
        .btn-modal {
          padding: 12px 16px;
          border-radius: 12px;
          border: none;
          font-size: 13px;
          font-weight: 700;
          cursor: pointer;
          transition: all 0.2s ease;
          box-shadow: var(--neu-shadow-sm);
          flex: 1;
        }
        .btn-modal:active {
          box-shadow: var(--neu-inset-sm);
          transform: scale(0.96);
        }
        .btn-cancel {
          background: var(--bg-color);
          color: #000000;
        }
        .btn-confirm {
          background: var(--bg-color);
          color: #991b1b;
        }
      </style>
</head>
<body>

  

  <main class="app-container">
      <header style="display: flex; justify-content: space-between; align-items: center; padding: 0 10px;">
                <h1 id="trackTitle" style="margin: 0; padding: 0; text-align: left; flex: 1;">Select Media</h1>
                <div style="display: flex; gap: 8px;">
                            <button class="btn-icon" id="btnThemeToggle" style="width: 32px; height: 32px; min-width: 32px;" title="Toggle Dark Mode">
                              <svg width="18" height="18" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                            </button>
                          </div>
              </header>

      <!-- SCREEN 1: UPLOAD -->
    <section id="uploadScreen" class="screen active">
      <input type="file" id="fileInput" accept="video/*, audio/*" style="display: none;">
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">
          <svg width="24" height="24" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        </div>
        <div class="upload-text">Tap to select Media</div>
        <div class="upload-subtext">Supports MP4, MOV, MP3, WAV, M4A</div>
      </div>
    </section>

    <!-- SCREEN 2: EDITOR -->
    <section id="editorScreen" class="screen">
      
      <div class="media-preview-container">
              <!-- We use a video element so it natively handles both audio and video files -->
              <video id="sourceMedia" playsinline></video>
        
              <div class="timeline-scroll" id="timelineScroll">
                <div class="timeline-inner" id="timelineInner">
                  <div class="time-ruler" id="timeRuler"></div>
                  <div class="trimmer-wrapper">
                    <canvas id="waveform"></canvas>
                    <div id="selectionOverlay" class="selection-overlay"></div>
              
                    <div class="range-track">
                      <input type="range" id="sliderStart" min="0" max="100" value="0" step="0.1">
                      <input type="range" id="sliderEnd" min="0" max="100" value="30" step="0.1">
                    </div>
                  </div>
                  <div class="playhead" id="playhead"></div>
                </div>
              </div>

              <div class="zoom-controls">
                <button class="zoom-btn" id="btnZoomOut" title="Zoom out">−</button>
                <span class="zoom-label" id="zoomLabel">1x</span>
                <button class="zoom-btn" id="btnZoomIn" title="Zoom in">+</button>
              </div>
            </div>

      <div class="time-info">
              <span id="timeStart">00:00</span>
              <span class="duration-badge" id="timeDuration">30.0s Ringtone</span>
              <span id="timeEnd">00:30</span>
            </div>

            <div class="gain-panel">
              <span>Vol</span>
              <input type="range" class="gain-slider" id="gainSlider" min="0.5" max="2" step="0.1" value="1">
              <span id="gainValue">100%</span>
            </div>

            <div class="controls">
              <button class="btn-icon" id="btnRewind" title="Back to Start">
                <svg width="20" height="20" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
              </button>
              <button class="btn-icon play-btn" id="btnPlayPause">
                <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon></svg>
                <svg id="pauseIcon" width="24" height="24" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="4" width="4" height="16" fill="currentColor"></rect><rect x="14" y="4" width="4" height="16" fill="currentColor"></rect></svg>
              </button>
              <button class="btn-icon btn-toggle active" id="btnLoop" title="Toggle Loop">
                <svg width="20" height="20" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
              </button>
            </div>

      <button class="btn-primary" id="btnExport">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Save & Export Ringtone
      </button>

      <button class="btn-text" onclick="resetApp()">Start Over</button>

          </section>

          <!-- Reset Modal -->
          <div id="resetModal" class="modal-overlay">
            <div class="modal-box">
              <h3>Start Over?</h3>
              <p>All unsaved progress will be lost.</p>
              <div class="modal-actions">
                <button class="btn-modal btn-cancel" onclick="closeResetModal()">Cancel</button>
                <button class="btn-modal btn-confirm" onclick="confirmResetApp()">Start Over</button>
              </div>
            </div>
          </div>
        </main>

        <script>
    const fileInput = document.getElementById('fileInput');
    const uploadScreen = document.getElementById('uploadScreen');
    const editorScreen = document.getElementById('editorScreen');
    const media = document.getElementById('sourceMedia');
    
    const sliderStart = document.getElementById('sliderStart');
    const sliderEnd = document.getElementById('sliderEnd');
    const selectionOverlay = document.getElementById('selectionOverlay');
    
    const timeStartEl = document.getElementById('timeStart');
    const timeEndEl = document.getElementById('timeEnd');
    const timeDurationEl = document.getElementById('timeDuration');
    
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnRewind = document.getElementById('btnRewind');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const btnExport = document.getElementById('btnExport');

    let duration = 0;
            let isPlaying = false;
            let animationFrame;
            let currentFile = null;

            const timelineScroll = document.getElementById('timelineScroll');
        const timelineInner = document.getElementById('timelineInner');
        const timeRuler = document.getElementById('timeRuler');
        const playhead = document.getElementById('playhead');
        const zoomLabel = document.getElementById('zoomLabel');
        const btnZoomIn = document.getElementById('btnZoomIn');
        const btnZoomOut = document.getElementById('btnZoomOut');

        let zoomLevel = 1;
                const MIN_ZOOM = 1;
                const MAX_ZOOM = 40;
                let waveformPeaks = null; // Real decoded audio peaks (null until decoded)

                // Interaction state to prevent auto-scroll from fighting the user
                let isTimelineInteracting = false;
                let timelineInteractionTimeout = null;

                function markTimelineInteraction() {
                  isTimelineInteracting = true;
                  clearTimeout(timelineInteractionTimeout);
                  timelineInteractionTimeout = setTimeout(() => {
                    isTimelineInteracting = false;
                  }, 800); // Resume auto-scroll 800ms after you let go
                }

                timelineScroll.addEventListener('pointerdown', () => {
                  isTimelineInteracting = true;
                  clearTimeout(timelineInteractionTimeout);
                });
                window.addEventListener('pointerup', () => {
                  if (isTimelineInteracting) markTimelineInteraction();
                });
                timelineScroll.addEventListener('wheel', markTimelineInteraction, {passive: true});
                timelineScroll.addEventListener('touchmove', markTimelineInteraction, {passive: true});

    // File Upload Handler
            fileInput.addEventListener('change', function(e) {
              const file = e.target.files[0];
              if (!file) return;
              currentFile = file;

              document.getElementById('trackTitle').innerText = file.name;

          const objectUrl = URL.createObjectURL(file);
                media.src = objectUrl;

                media.onloadedmetadata = () => {
                        duration = media.duration;
        
              // Setup Sliders
              sliderStart.max = duration;
              sliderEnd.max = duration;
        
              // Default selection: up to 30 seconds
              sliderStart.value = 0;
              sliderEnd.value = Math.min(30, duration);
        
              uploadScreen.classList.remove('active');
              editorScreen.classList.add('active');

              zoomLevel = 1;
              waveformPeaks = null;
              applyZoom();
              updateUI();
              drawProceduralWaveform();
              decodeRealWaveform(file);
              updatePlayhead();

              // Request full screen on first file pick (needs a user gesture; ignored if unsupported)
              try {
                const root = document.documentElement;
                if (!document.fullscreenElement && root.requestFullscreen) {
                  root.requestFullscreen().catch(() => {});
                }
              } catch (err) {}
            };
          });

    // Slider Logic (Prevent cross-over)
    const minGap = 1.0; // minimum 1 second ringtone

    function updateUI() {
          let startVal = parseFloat(sliderStart.value);
          let endVal = parseFloat(sliderEnd.value);

          if (endVal - startVal <= minGap) {
            if (this === sliderStart) {
          sliderStart.value = endVal - minGap;
          startVal = parseFloat(sliderStart.value);
        } else {
          sliderEnd.value = startVal + minGap;
          endVal = parseFloat(sliderEnd.value);
        }
      }

      // Update overlay visual
      const startPercent = (startVal / duration) * 100;
      const endPercent = (endVal / duration) * 100;
      selectionOverlay.style.left = startPercent + '%';
      selectionOverlay.style.width = (endPercent - startPercent) + '%';

      // Update Texts
      timeStartEl.innerText = formatTime(startVal);
      timeEndEl.innerText = formatTime(endVal);
      timeDurationEl.innerText = (endVal - startVal).toFixed(1) + 's Ringtone';

      // Enforce playback bounds if currently playing
      if (isPlaying && (media.currentTime < startVal || media.currentTime > endVal)) {
        media.currentTime = startVal;
      }
    }

    sliderStart.addEventListener('input', updateUI);
    sliderEnd.addEventListener('input', updateUI);

    // Playback Logic
    function togglePlay() {
      if (isPlaying) {
        media.pause();
        isPlaying = false;
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        cancelAnimationFrame(animationFrame);
      } else {
        const startVal = parseFloat(sliderStart.value);
        const endVal = parseFloat(sliderEnd.value);
        
        if (media.currentTime < startVal || media.currentTime >= endVal) {
          media.currentTime = startVal;
        }
        
        media.play();
        isPlaying = true;
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        trackPlayback();
      }
    }

    function trackPlayback() {
              if (!isPlaying) return;
      
              const endVal = parseFloat(sliderEnd.value);
              const startVal = parseFloat(sliderStart.value);
      
              // Check playback bounds based on loop toggle
              if (media.currentTime >= endVal) {
                if (isLooping) {
                  media.currentTime = startVal;
                } else {
                  togglePlay();
                  media.currentTime = startVal;
                  updatePlayhead();
                  return;
                }
              }

              updatePlayhead();
              followPlayhead();
      
              animationFrame = requestAnimationFrame(trackPlayback);
            }

        // Moves the red playback line to the current time
                function updatePlayhead() {
                  if (!duration || isDraggingPlayhead) return;
                  const pct = (media.currentTime / duration) * 100;
                  playhead.style.left = pct + '%';
                }

                // Playhead Drag / Scrubbing Logic
                let isDraggingPlayhead = false;
                let wasPlayingBeforeDrag = false;

                function setPlayheadFromPointer(clientX) {
                  if (!duration) return;
                  const rect = timelineInner.getBoundingClientRect();
                  const offsetX = clientX - rect.left;
                  const clampedX = Math.max(0, Math.min(rect.width, offsetX));
                  const newTime = (clampedX / rect.width) * duration;
          
                  media.currentTime = newTime;
                  playhead.style.left = ((clampedX / rect.width) * 100) + '%';
                }

                playhead.addEventListener('pointerdown', (e) => {
                  if (!duration) return;
                  e.preventDefault();
                  e.stopPropagation();
                  isDraggingPlayhead = true;
                  wasPlayingBeforeDrag = isPlaying;
                  if (isPlaying) {
                    media.pause();
                    isPlaying = false;
                    playIcon.style.display = 'block';
                    pauseIcon.style.display = 'none';
                    cancelAnimationFrame(animationFrame);
                  }
                  playhead.setPointerCapture(e.pointerId);
                });

                playhead.addEventListener('pointermove', (e) => {
                  if (!isDraggingPlayhead) return;
                  setPlayheadFromPointer(e.clientX);
                });

                const stopPlayheadDrag = (e) => {
                          if (!isDraggingPlayhead) return;
                          isDraggingPlayhead = false;
                          try {
                            playhead.releasePointerCapture(e.pointerId);
                          } catch (err) {}
                          if (wasPlayingBeforeDrag) {
                            togglePlay();
                          }
                        };

                        playhead.addEventListener('pointerup', stopPlayheadDrag);
                        playhead.addEventListener('pointercancel', stopPlayheadDrag);

                        // Feature 3: Click-to-Seek on Timeline
                        timelineInner.addEventListener('click', (e) => {
                          if (!duration || isDraggingPlayhead || e.target.closest('input[type=range]')) return;
                          setPlayheadFromPointer(e.clientX);
                        });

                        // Feature 4: Volume / Gain Normalization
                        const gainSlider = document.getElementById('gainSlider');
                        const gainValue = document.getElementById('gainValue');
                        let audioCtxVolume = null;
                        let gainNode = null;

                        gainSlider.addEventListener('input', (e) => {
                          const val = parseFloat(e.target.value);
                          gainValue.innerText = Math.round(val * 100) + '%';
                          if (val <= 1) {
                            media.volume = val;
                            if (gainNode) gainNode.gain.value = 1;
                          } else {
                            media.volume = 1;
                            if (!audioCtxVolume) {
                              try {
                                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                                audioCtxVolume = new AudioContextClass();
                                const source = audioCtxVolume.createMediaElementSource(media);
                                gainNode = audioCtxVolume.createGain();
                                source.connect(gainNode);
                                gainNode.connect(audioCtxVolume.destination);
                              } catch (err) {}
                            }
                            if (gainNode) gainNode.gain.value = val;
                          }
                        });

                        // Feature 6: Loop Selection Toggle
                        let isLooping = true;
                        const btnLoop = document.getElementById('btnLoop');
                        btnLoop.addEventListener('click', () => {
                          isLooping = !isLooping;
                          btnLoop.classList.toggle('active', isLooping);
                        });

                        // Keeps the playhead visible by auto-scrolling the timeline while playing
                                function followPlayhead() {
                                  if (isTimelineInteracting || isDraggingPlayhead) return; // Suppress auto-scroll if user is zooming/sliding
          
                                  const inner = timelineInner.offsetWidth;
                                  const view = timelineScroll.clientWidth;
                                  if (inner <= view) return;
          const x = (media.currentTime / duration) * inner;
          const left = timelineScroll.scrollLeft;
          if (x < left + 20 || x > left + view - 40) {
            timelineScroll.scrollLeft = Math.max(0, x - view * 0.3);
          }
        }

        // Zoom: widens the inner timeline; the scroll container makes it scrollable
        function applyZoom(anchorTime) {
          const view = timelineScroll.clientWidth;
          const prevInner = timelineInner.offsetWidth || view;
          const anchorPct = (typeof anchorTime === 'number' && duration) ? anchorTime / duration : null;
          const anchorScreenX = anchorPct !== null ? (anchorPct * prevInner - timelineScroll.scrollLeft) : 0;

          timelineInner.style.width = (100 * zoomLevel) + '%';
          zoomLabel.textContent = (Math.round(zoomLevel * 10) / 10) + 'x';

          if (anchorPct !== null) {
            timelineScroll.scrollLeft = Math.max(0, anchorPct * timelineInner.offsetWidth - anchorScreenX);
          }

          drawRuler();
          if (duration) drawProceduralWaveform();
          updatePlayhead();
        }

        function setZoom(newZoom, anchorTime) {
          zoomLevel = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
          applyZoom(anchorTime);
        }

        btnZoomIn.addEventListener('click', () => setZoom(zoomLevel * 1.6, media.currentTime));
        btnZoomOut.addEventListener('click', () => setZoom(zoomLevel / 1.6, media.currentTime));

        // Pinch-to-zoom on touch screens
        let pinchStartDist = 0;
        let pinchStartZoom = 1;
        timelineScroll.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            pinchStartDist = Math.sqrt(dx * dx + dy * dy);
            pinchStartZoom = zoomLevel;
          }
        }, { passive: true });
        timelineScroll.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2 && pinchStartDist > 0) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const rect = timelineScroll.getBoundingClientRect();
            const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
            const anchorTime = ((timelineScroll.scrollLeft + midX) / timelineInner.offsetWidth) * duration;
            setZoom(pinchStartZoom * (dist / pinchStartDist), anchorTime);
            e.preventDefault();
          }
        }, { passive: false });
        timelineScroll.addEventListener('touchend', () => { pinchStartDist = 0; }, { passive: true });

        // Ctrl/Cmd + wheel zoom on desktop
        timelineScroll.addEventListener('wheel', (e) => {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            const rect = timelineScroll.getBoundingClientRect();
            const anchorTime = ((timelineScroll.scrollLeft + (e.clientX - rect.left)) / timelineInner.offsetWidth) * duration;
            setZoom(zoomLevel * (e.deltaY < 0 ? 1.15 : 1 / 1.15), anchorTime);
          }
        }, { passive: false });

        // Draws time ticks and labels that adapt to the zoom level
                function drawRuler() {
                  timeRuler.innerHTML = '';
                  if (!duration) return;
                  const steps = [0.1, 0.25, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300];
                  const pxPerSec = timelineInner.offsetWidth / duration;
                  let step = steps[steps.length - 1];
                  for (const s of steps) {
                    if (s * pxPerSec >= 70) { step = s; break; }
                  }
          
                  const numSubdivisions = 5;
                  const subStep = step / numSubdivisions;
                  const totalTicks = Math.ceil(duration / subStep);

                  for (let i = 0; i <= totalTicks; i++) {
                    const t = i * subStep;
                    if (t > duration) break;
            
                    const isMain = (i % numSubdivisions === 0);
            
                    const tick = document.createElement('div');
                    tick.className = isMain ? 'ruler-tick' : 'ruler-subtick';
                    tick.style.left = ((t / duration) * 100) + '%';
                    timeRuler.appendChild(tick);
            
                    if (isMain) {
                      const label = document.createElement('div');
                      label.className = 'ruler-label';
                      label.style.left = ((t / duration) * 100) + '%';
                      label.textContent = step < 1 ? t.toFixed(1) + 's' : formatTime(t);
                      timeRuler.appendChild(label);
                    }
                  }
                }

        // Decodes the real audio so the graph shows the true waveform (falls back to procedural on failure)
            function decodeRealWaveform(file) {
              try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const reader = new FileReader();
                reader.onload = () => {
                  const audioCtx = new AudioCtx();
                  audioCtx.decodeAudioData(reader.result).then((buffer) => {
                    const data = buffer.getChannelData(0);
                    const bucketCount = 12000;
                    const block = Math.max(1, Math.floor(data.length / bucketCount));
                    const peaks = new Float32Array(bucketCount);
                    for (let i = 0; i < bucketCount; i++) {
                      let max = 0;
                      const startIdx = i * block;
                      const endIdx = Math.min(data.length, startIdx + block);
                      for (let j = startIdx; j < endIdx; j += 4) {
                        const v = Math.abs(data[j]);
                        if (v > max) max = v;
                      }
                      peaks[i] = max;
                    }
                    waveformPeaks = peaks;
                    drawProceduralWaveform();
                    audioCtx.close().catch(() => {});
                  }).catch(() => {
                    audioCtx.close().catch(() => {});
                  });
                };
                reader.onerror = () => {};
                reader.readAsArrayBuffer(file);
              } catch (err) {}
            }

        // Keep the playhead in sync when scrubbing or while paused
        media.addEventListener('timeupdate', updatePlayhead);
        media.addEventListener('seeked', updatePlayhead);
        window.addEventListener('resize', () => { if (duration) applyZoom(); });

    btnPlayPause.addEventListener('click', togglePlay);
    btnRewind.addEventListener('click', () => {
      media.currentTime = parseFloat(sliderStart.value);
      if(!isPlaying) togglePlay();
    });

    // Formatting Utils
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // Procedural Aesthetic Waveform (Since extracting actual audio data requires WebAudio API decoding which takes time)
        function drawProceduralWaveform() {
              const canvas = document.getElementById('waveform');
              const ctx = canvas.getContext('2d');
              canvas.width = Math.min(canvas.offsetWidth * 2, 16000); // High DPI, capped for memory safety
              canvas.height = canvas.offsetHeight * 2;
      
              const width = canvas.width;
              const height = canvas.height;
              const midY = height / 2;
      
              ctx.clearRect(0, 0, width, height);

              const isDark = document.documentElement.classList.contains('dark-mode');
              
                            // Subtle horizontal grid reference lines
                            ctx.lineWidth = 1;
                            ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';
                            [0.2, 0.35, 0.5, 0.65, 0.8].forEach(ratio => {
                const gy = height * ratio;
                ctx.beginPath();
                ctx.moveTo(0, gy);
                ctx.lineTo(width, gy);
                ctx.stroke();
              });
      
              const barWidth = 1.5;
              const barGap = 1.5;
              const bars = Math.floor(width / (barWidth + barGap));
      
              for (let i = 0; i < bars; i++) {
                let primaryPeak = 0;
                let secondaryPeak = 0;

                if (waveformPeaks) {
                  const from = Math.floor((i / bars) * waveformPeaks.length);
                  const to = Math.max(from + 1, Math.floor(((i + 1) / bars) * waveformPeaks.length));
                  let sum = 0;
                  for (let k = from; k < to && k < waveformPeaks.length; k++) {
                    const val = waveformPeaks[k];
                    if (val > primaryPeak) primaryPeak = val;
                    sum += val;
                  }
                  secondaryPeak = sum / (to - from);
                } else {
                  const harmonic1 = Math.sin(i * 0.08) * 0.35;
                  const harmonic2 = Math.sin(i * 0.33) * 0.25;
                  const harmonic3 = Math.cos(i * 0.85) * 0.15;
                  const microJitter = (Math.sin(i * 3.14) * 0.5 + 0.5) * 0.15;
                  primaryPeak = Math.abs(harmonic1 + harmonic2 + harmonic3) + microJitter + 0.06;
                  secondaryPeak = primaryPeak * 0.55;
                }

                const totalH = Math.max(3, Math.min(1, primaryPeak * 1.6) * height * 0.86);
                const coreH = Math.max(2, Math.min(1, secondaryPeak * 1.6) * height * 0.86);
                const x = i * (barWidth + barGap);

                // Layer 1: Outer detailed frequency envelope
                                ctx.fillStyle = waveformPeaks ? (isDark ? 'rgba(239, 235, 233, 0.35)' : 'rgba(30, 41, 59, 0.35)') : (isDark ? 'rgba(239, 235, 233, 0.2)' : 'rgba(30, 41, 59, 0.2)');
                                ctx.fillRect(x, midY - totalH / 2, barWidth, totalH);

                                // Layer 2: Core density spike
                                ctx.fillStyle = waveformPeaks ? (isDark ? 'rgba(239, 235, 233, 0.85)' : 'rgba(15, 23, 42, 0.85)') : (isDark ? 'rgba(239, 235, 233, 0.6)' : 'rgba(15, 23, 42, 0.6)');
                                ctx.fillRect(x, midY - coreH / 2, barWidth, coreH);
                              }

                              // Center baseline reference
                                            ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.12)' : 'rgba(0, 0, 0, 0.12)';
                                            ctx.beginPath();
                                            ctx.moveTo(0, midY);
                                            ctx.lineTo(width, midY);
                                            ctx.stroke();
                                          }

    // Real Client-Side Audio Export
        btnExport.addEventListener('click', async () => {
          if (!currentFile) return;
          const btnOrigText = btnExport.innerHTML;
          btnExport.innerHTML = `<svg class="spinner" width="18" height="18" viewBox="0 0 24 24" style="animation: spin 1s linear infinite;"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg> Exporting Audio...`;
          btnExport.style.pointerEvents = 'none';
      
          try {
            const startVal = parseFloat(sliderStart.value);
            const endVal = parseFloat(sliderEnd.value);
            const durationCut = endVal - startVal;
        
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContextClass();
            const arrayBuffer = await currentFile.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        
            const offlineCtx = new OfflineAudioContext(
              audioBuffer.numberOfChannels,
              Math.ceil(durationCut * audioBuffer.sampleRate),
              audioBuffer.sampleRate
            );
        
            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;
        
            const gainNode = offlineCtx.createGain();
            gainNode.gain.value = parseFloat(document.getElementById('gainSlider').value) || 1;
        
            source.connect(gainNode);
            gainNode.connect(offlineCtx.destination);
        
            source.start(0, startVal, durationCut);
        
            const renderedBuffer = await offlineCtx.startRendering();
                    const wavBlob = audioBufferToWav(renderedBuffer);
                    const filename = `ringtone_${currentFile.name.replace(/\.[^/.]+$/, "")}.wav`;
        
                    // Strategy 1: Native Android Share Sheet (Best for Cordova/WebViews)
                    const fileToSave = new File([wavBlob], filename, { type: 'audio/wav' });
        
                    if (navigator.canShare && navigator.canShare({ files: [fileToSave] })) {
                      try {
                        await navigator.share({
                          title: 'Exported Ringtone',
                          files: [fileToSave]
                        });
                      } catch (shareErr) {
                        console.log("Share cancelled or failed", shareErr);
                      }
                    } else {
                      // Strategy 2: Base64 Data URI Fallback (Bypasses Cordova blob restrictions)
                      const reader = new FileReader();
                      reader.readAsDataURL(wavBlob);
                      reader.onloadend = function() {
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = reader.result;
                        a.download = filename;
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(() => document.body.removeChild(a), 100);
                      };
                    }
        
                    btnExport.innerHTML = btnOrigText;
                    btnExport.style.pointerEvents = 'auto';
                  } catch (err) {
            console.error(err);
            alert("Error exporting audio: " + err.message);
            btnExport.innerHTML = btnOrigText;
            btnExport.style.pointerEvents = 'auto';
          }
        });

        function audioBufferToWav(buffer) {
          const numOfChan = buffer.numberOfChannels;
          const length = buffer.length * numOfChan * 2 + 44;
          const bufferArr = new ArrayBuffer(length);
          const view = new DataView(bufferArr);
          const channels = [];
          let i, sample, offset = 0, pos = 0;

          function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
          function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

          setUint32(0x46464952); // "RIFF"
          setUint32(length - 8); // file length - 8
          setUint32(0x45564157); // "WAVE"
          setUint32(0x20746d66); // "fmt " chunk
          setUint32(16); // length = 16
          setUint16(1); // PCM (uncompressed)
          setUint16(numOfChan);
          setUint32(buffer.sampleRate);
          setUint32(buffer.sampleRate * 2 * numOfChan); // avg. bytes/sec
          setUint16(numOfChan * 2); // block-align
          setUint16(16); // 16-bit (hardcoded)
          setUint32(0x61746164); // "data" - chunk
          setUint32(length - pos - 4); // chunk length

          for (i = 0; i < buffer.numberOfChannels; i++) {
            channels.push(buffer.getChannelData(i));
          }

          while (pos < length) {
            for (i = 0; i < numOfChan; i++) {
              sample = Math.max(-1, Math.min(1, channels[i][offset]));
              sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
              view.setInt16(pos, sample, true);
              pos += 2;
            }
            offset++;
          }

          return new Blob([bufferArr], { type: "audio/wav" });
        }

    // Reset App Modal Logic
        const resetModal = document.getElementById('resetModal');

        function resetApp() {
          resetModal.classList.add('active');
        }

        function closeResetModal() {
          resetModal.classList.remove('active');
        }

        function confirmResetApp() {
                  closeResetModal();
      
                  media.pause();
                        media.removeAttribute('src');
                        fileInput.value = '';
                        currentFile = null;
                        document.getElementById('trackTitle').innerText = 'Select Media';
                        waveformPeaks = null;
                zoomLevel = 1;
                duration = 0;
                isPlaying = false;
          playIcon.style.display = 'block';
          pauseIcon.style.display = 'none';
          cancelAnimationFrame(animationFrame);
      
          editorScreen.classList.remove('active');
          uploadScreen.classList.add('active');
        }

    // Theme Toggle Logic
        document.getElementById('btnThemeToggle').addEventListener('click', () => {
          document.documentElement.classList.toggle('dark-mode');
          if (duration) drawProceduralWaveform();
        });

        // Setup CSS for spinner
        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);
      </script>
    </body>
